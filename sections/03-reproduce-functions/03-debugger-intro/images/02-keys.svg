<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Segoe UI',sans-serif">
<defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#475569"/></marker><marker id="aRsub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
<text x="450" y="44" text-anchor="middle" font-size="26.25" fill="#0f172a" font-weight="700">同じ操作の、Excel とスプレッドシートでの押し方</text>
<rect x="40" y="76" width="150" height="34" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="98.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">手順</text>
<rect x="190" y="76" width="290" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="98.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Excel（VBE）</text>
<rect x="480" y="76" width="380" height="34" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="98.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">スプレッドシート（Apps Script）</text>
<rect x="40" y="110" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="132.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">① 置く</text>
<rect x="190" y="110" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="132.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">左の灰色の帯をクリック（F9）</text>
<rect x="480" y="110" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="132.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">行番号の左をクリック</text>
<rect x="40" y="144" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="166.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">② 実行する</text>
<rect x="190" y="144" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="166.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">マクロの中で F5</text>
<rect x="480" y="144" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="166.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">「デバッグ」（「実行」では止まらない）</text>
<rect x="40" y="178" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="200.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">③ 変数を見る</text>
<rect x="190" y="178" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="200.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">表示 → ローカル ウィンドウ</text>
<rect x="480" y="178" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="200.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">右の「デバッガ」パネルの「変数」</text>
<rect x="40" y="212" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="234.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">④ 1 行進める</text>
<rect x="190" y="212" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="234.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">F8（Mac は ⌘ + Shift + I）</text>
<rect x="480" y="212" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="234.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">ステップ オーバー</text>
<rect x="40" y="246" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="268.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">続きを一気に</text>
<rect x="190" y="246" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="268.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">F5</text>
<rect x="480" y="246" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="268.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">再開（▶）</text>
<rect x="40" y="280" width="150" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="115" y="302.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">⑤ 止める</text>
<rect x="190" y="280" width="290" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="335" y="302.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">■ リセット</text>
<rect x="480" y="280" width="380" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="670" y="302.25" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">■ 停止</text>
<rect x="40" y="76" width="820" height="238" fill="none" stroke="#3b82f6" stroke-width="2"/>
</svg>
