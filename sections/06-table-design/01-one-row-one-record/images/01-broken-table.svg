<text x="772" y="232" text-anchor="start" font-size="17" fill="#475569" font-weight="600">③ 数とメモが同じセル</text>
<text x="772" y="260" text-anchor="start" font-size="13" fill="#475569" font-weight="400"><tspan x="772" dy="0">「2 ※返品1」は</tspan><tspan x="772" dy="18.85">数として足せない</tspan></text>
