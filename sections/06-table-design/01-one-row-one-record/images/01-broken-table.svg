<text x="40" y="132" text-anchor="start" font-size="17" fill="#475569" font-weight="600">① セルの結合</text>
<text x="40" y="160" text-anchor="start" font-size="13" fill="#475569" font-weight="400"><tspan x="40" dy="0">2 行目の顧客が空になり</tspan><tspan x="40" dy="18.85">SUMIF もフィルターも外れる</tspan></text>
<rect x="24" y="300" width="250" height="84" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
