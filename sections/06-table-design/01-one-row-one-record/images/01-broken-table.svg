<text x="405" y="334.55" text-anchor="middle" font-size="13" font-weight="400" fill="#0f172a">みなと物産</text>
<rect x="340" y="90" width="390" height="280" fill="none" stroke="#f97316" stroke-width="2"/>
<rect x="14" y="40" width="280" height="176" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="30" y="72" text-anchor="start" font-size="25.26388888888889" fill="#475569" font-weight="600">① セルの結合</text>
<text x="30" y="102" text-anchor="start" font-size="19.319444444444446" fill="#475569" font-weight="400"><tspan x="30" dy="0">値は先頭の 1 行だけ。</tspan><tspan x="30" dy="28.0132">2 行目の顧客が空で</tspan><tspan x="30" dy="28.0132">SUMIF・フィルター・</tspan><tspan x="30" dy="28.0132">並べ替えから漏れる</tspan></text>
<rect x="14" y="300" width="280" height="176" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="30" y="332" text-anchor="start" font-size="25.26388888888889" fill="#475569" font-weight="600">② 小計と空行</text>
<text x="30" y="362" text-anchor="start" font-size="19.319444444444446" fill="#475569" font-weight="400"><tspan x="30" dy="0">列全体の合計に</tspan><tspan x="30" dy="28.0132">小計が混ざって 2 倍に。</tspan><tspan x="30" dy="28.0132">ピボットは空行を</tspan><tspan x="30" dy="28.0132">表の終わりと見なす</tspan></text>
<rect x="776" y="10" width="280" height="148" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="792" y="42" text-anchor="start" font-size="25.26388888888889" fill="#475569" font-weight="600">④ 月が横に並ぶ</text>
<text x="792" y="72" text-anchor="start" font-size="19.319444444444446" fill="#475569" font-weight="400"><tspan x="792" dy="0">月が増えるたびに</tspan><tspan x="792" dy="28.0132">列を足し、式も</tspan><tspan x="792" dy="28.0132">マクロの範囲も直す</tspan></text>
<rect x="776" y="172" width="280" height="148" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="792" y="204" text-anchor="start" font-size="25.26388888888889" fill="#475569" font-weight="600">③ 数とメモが混在</text>
<text x="792" y="234" text-anchor="start" font-size="19.319444444444446" fill="#475569" font-weight="400"><tspan x="792" dy="0">「2 ※返品1」は文字で</tspan><tspan x="792" dy="28.0132">合計に入らない。</tspan><tspan x="792" dy="28.0132">返品の数も読めない</tspan></text>
<rect x="776" y="334" width="280" height="148" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="792" y="366" text-anchor="start" font-size="25.26388888888889" fill="#475569" font-weight="600">⑤ 値に単位</text>
<text x="792" y="396" text-anchor="start" font-size="19.319444444444446" fill="#475569" font-weight="400"><tspan x="792" dy="0">「10個」は文字。</tspan><tspan x="792" dy="28.0132">見た目は数でも</tspan><tspan x="792" dy="28.0132">足し算に入らない</tspan></text>
